name: Publish v1.2.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean release commit
        uses: actions/checkout@v4
        with:
          ref: f5f383993a1d1aa1f90b8236d74594501f1e2991

      - name: Validate
        run: python3 scripts/validate_release.py

      - name: Package
        run: python3 scripts/package_release.py --output dist

      - name: Publish v1.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Production Dashboard UI/UX Skill v1.2.0

          Hardening release focused on reliability, installation, safe existing-product improvements, and public distribution readiness.

          Highlights:
          - Single canonical Skill source with progressive disclosure
          - Correct Codex skill-installer path and smoke-tested installation
          - Official OpenAI quick validation in CI
          - Collaborative, Delegated, and Audit-only modes
          - Working-tree and production-data safety
          - Dedicated accessibility and frontend-performance guidance
          - Audit coverage reporting and regression-aware QA
          - Stronger RTL/LTR and localization coverage
          - Design Profile provenance and locked constraints
          - Hardened Plugin metadata and public submission tests
          - Deterministic Claude and Plugin ZIP packages with SHA-256 checksums
          EOF

          if gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.2.0 --repo "$GITHUB_REPOSITORY" --title "Production Dashboard UI/UX Skill v1.2.0" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create v1.2.0 --repo "$GITHUB_REPOSITORY" --target f5f383993a1d1aa1f90b8236d74594501f1e2991 --title "Production Dashboard UI/UX Skill v1.2.0" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

          gh release upload v1.2.0 --repo "$GITHUB_REPOSITORY" --clobber dist/*.zip dist/SHA256SUMS.txt
