name: Rebuild Claude Skill Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Claude-ready ZIP
        run: |
          set -euo pipefail
          mkdir -p dist/production-dashboard-ui-ux-skill/references
          cp SKILL.md dist/production-dashboard-ui-ux-skill/SKILL.md
          cp references/*.md dist/production-dashboard-ui-ux-skill/references/
          cd dist
          zip -r production-dashboard-ui-ux-skill-claude-v1.0.0.zip production-dashboard-ui-ux-skill

      - name: Upload ZIP to v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.0             dist/production-dashboard-ui-ux-skill-claude-v1.0.0.zip             --repo "$GITHUB_REPOSITORY"             --clobber
