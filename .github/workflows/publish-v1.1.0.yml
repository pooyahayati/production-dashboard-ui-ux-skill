name: Publish v1.1.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve clean release commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.parents[0].sha')"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout release state
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Create or update v1.1.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          git tag -f v1.1.0 "$TARGET_SHA"
          git push origin refs/tags/v1.1.0 --force

      - name: Build Claude-ready package
        run: |
          set -euo pipefail
          mkdir -p dist/production-dashboard-ui-ux-skill/references
          cp SKILL.md dist/production-dashboard-ui-ux-skill/SKILL.md
          cp references/*.md dist/production-dashboard-ui-ux-skill/references/
          cd dist
          zip -r production-dashboard-ui-ux-skill-claude-v1.1.0.zip production-dashboard-ui-ux-skill

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Production Dashboard UI/UX Skill v1.1.0

          This release expands the skill from new-dashboard design into a complete **existing-product UI/UX audit and improvement workflow**.

          ## Highlights

          - Dedicated existing-product audit and improvement mode
          - Works with completed/live projects even when no design-profile.md exists
          - Observed Baseline before making changes
          - Baseline → Audit → Prioritize → Fix → Validate → Compare → Refine workflow
          - Severity, impact, scope, confidence, and fix-type classification
          - Safe-fix vs approval-required decision rules
          - Before/after comparison and regression-aware QA
          - Visual-system audit for colors, semantic palette, typography, icons, surfaces, and density
          - Logo and brand-treatment audit
          - Low-risk logo usage fixes such as sizing, placement, spacing, contrast, and theme variants
          - Controlled palette and typography refreshes
          - Explicit approval before actual logo/brand-identity replacement
          - Partial Rediscovery for strategic changes in existing products
          - Improved Agent metadata and public test cases

          Business logic, permissions, validation, routing, API contracts, and data semantics remain protected during UI/UX improvements.
          EOF

          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.1.0               --repo "$GITHUB_REPOSITORY"               --title "Production Dashboard UI/UX Skill v1.1.0"               --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create v1.1.0               --repo "$GITHUB_REPOSITORY"               --target "${{ steps.target.outputs.sha }}"               --title "Production Dashboard UI/UX Skill v1.1.0"               --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

          gh release upload v1.1.0             dist/production-dashboard-ui-ux-skill-claude-v1.1.0.zip             --repo "$GITHUB_REPOSITORY"             --clobber
